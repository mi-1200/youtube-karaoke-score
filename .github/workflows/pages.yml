name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site && cp index.html privacy.html core.js version.js _site/ && cp -r vendor _site/
          # 古い core.js / version.js がブラウザに残らないよう、版ごとに URL を変える
          sed -i "s#src=\"version.js\"#src=\"version.js?v=${GITHUB_SHA::8}\"#; s#src=\"core.js\"#src=\"core.js?v=${GITHUB_SHA::8}\"#" _site/index.html
          grep -q "core.js?v=" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # version.js のバージョンに合わせて、まだ無ければ GitHub にタグ（例: v0.3.0）を付ける
  tag:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version tag if missing
        run: |
          v=$(node -e "global.window={};require('./version.js');console.log(window.UTASCORE_VERSION)")
          echo "version: $v"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "tag v$v already exists"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$v" -m "v$v"
          git push origin "v$v"
